<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HIIT タイマー - 移転しました</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #F7F5F2;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans JP', sans-serif;
    color: #191815;
    padding: 24px;
  }
  .card {
    max-width: 420px;
    width: 100%;
    background: #fff;
    border-radius: 20px;
    padding: 48px 32px;
    text-align: center;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  .icon {
    width: 64px;
    height: 64px;
    border-radius: 16px;
    background: #F2683C;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 24px;
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 12px;
  }
  p {
    font-size: 15px;
    color: #6E6A62;
    line-height: 1.6;
    margin-bottom: 28px;
  }
  .btn {
    display: inline-block;
    background: #F2683C;
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    text-decoration: none;
    padding: 14px 36px;
    border-radius: 14px;
    transition: opacity 0.2s;
  }
  .btn:hover { opacity: 0.85; }
  .sub {
    margin-top: 16px;
    font-size: 13px;
    color: #A8A49C;
  }
  .sub a { color: #A8A49C; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
      <polygon points="6,4 20,12 6,20" fill="#fff"/>
    </svg>
  </div>
  <h1>HIIT タイマーは移転しました</h1>
  <p>新しいリポジトリでリニューアル版を公開しています。<br>ブックマークの更新をお願いします。</p>
  <a class="btn" href="https://tatsuosakurai.github.io/hiit-timer/">新しいページへ →</a>
  <div class="sub">
    <a href="https://github.com/tatsuosakurai/hiit-timer">GitHub リポジトリ</a>
  </div>
</div>
</body>
</html>
